composeMultiplatform = "1.11.1"
kotlin = "2.4.10"
kotlinx-datetime = "0.8.0"
material3 = "1.10.0-alpha05"
materialIconsExtended = "1.7.3"
qrscannerCompose = "1.1.2"
qrscannerCore = "1.1.2"
qrscannerMlkit = "1.1.2"
hivemqMqttClient = "1.3.17"
kotlinx-serialization = "1.11.0"
datastore = "1.2.1"
